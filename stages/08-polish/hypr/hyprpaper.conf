# hyprpaper reads ~/.config/hypr/hyprpaper.conf
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

# An empty monitor means "every monitor". path can also be a folder,
# then add "timeout = 300" to rotate through it every 5 minutes.
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper.png
    fit_mode = cover
}

# Don't draw the Hyprland splash text over the wallpaper.
splash = false

# Swap wallpapers live, without editing this file:
#   hyprctl hyprpaper wallpaper ', ~/Pictures/wallpapers/other.png'
