# fuzzel reads ~/.config/fuzzel/fuzzel.ini   (all options: man fuzzel.ini)
# Colours are RRGGBBAA: Catppuccin Mocha again, and the last two digits are opacity.

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
terminal=foot -e
layer=overlay
width=40
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10

[colors]
background=1e1e2ee6
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=cba6f7ff

[border]
width=3
radius=12
selection-radius=8
